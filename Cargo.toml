[workspace]
resolver = "2"
members = [
    "crates/vibefreak-core",
    "crates/vibefreak-web",
    "crates/vibefreak-cli",
]

[workspace.dependencies]
unicorn-engine = { version = "2", default-features = false, features = ["arch_arm"] }
unicorn-engine-sys = { version = "2", default-features = false, features = ["arch_arm"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
ringbuf = "0.4"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
cpal = "0.15"
rayon = "1.10"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
unicorn-engine-sys = { path = "vendor/unicorn-engine-sys" }

